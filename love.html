<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>晴晴我爱你 💖</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000010;
      overflow: hidden;
      height: 100vh;
      font-family: 'Georgia', 'Times New Roman', serif;
      cursor: crosshair;
    }

    canvas { display: block; }

    #titleBox {
      position: fixed;
      top: 3%;
      width: 100%;
      text-align: center;
      z-index: 20;
      pointer-events: none;
    }

    .title {
      font-size: clamp(38px, 6vw, 60px);
      font-weight: bold;
      letter-spacing: 12px;
      background: linear-gradient(135deg, #ff6b9d, #ff2d78, #ff6b9d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shine 2.5s ease-in-out infinite;
      filter: drop-shadow(0 0 35px rgba(255, 45, 120, 0.8));
    }

    @keyframes shine {
      0%, 100% { filter: drop-shadow(0 0 35px rgba(255, 45, 120, 0.8)); }
      50% { filter: drop-shadow(0 0 70px rgba(255, 107, 157, 1)) drop-shadow(0 0 120px rgba(255, 180, 200, 0.8)); }
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: clamp(12px, 2.5vw, 18px);
      letter-spacing: 6px;
      margin-top: 5px;
      animation: fadeInOut 3s infinite;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }

    .hint {
      position: fixed;
      bottom: 3%;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.35);
      font-size: 13px;
      z-index: 10;
      pointer-events: none;
      letter-spacing: 4px;
    }

    #musicBtn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 100;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 2px solid rgba(255, 107, 157, 0.6);
      background: rgba(0, 0, 0, 0.55);
      color: #ff6b9d;
      font-size: 26px;
      cursor: pointer;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 107, 157, 0.3);
    }

    #musicBtn:hover {
      border-color: #ffaacc;
      box-shadow: 0 0 45px rgba(255, 107, 157, 0.7);
      transform: scale(1.1);
    }

    #musicBtn:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>
  <div id="titleBox">
    <div class="title">晴晴我爱你</div>
    <div class="subtitle">💫 你是我宇宙中最亮的星 💫</div>
  </div>
  <div class="hint">✨ 动动手指 · 烟火为你绽放 ✨</div>

  <button id="musicBtn" title="音乐">🎵</button>

  <canvas id="c"></canvas>

  <audio id="bgm" loop preload="auto">
    <source src="https://files.catbox.moe/6z6g0b.mp3" type="audio/mpeg">
  </audio>

  <script>
    // ========== 音乐控制 ==========
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('musicBtn');
    let musicOn = false;

    function playMusic() {
      bgm.volume = 0.5;
      bgm.play().catch(() => {});
      musicOn = true;
      musicBtn.textContent = '💗';
      musicBtn.style.borderColor = '#ffaacc';
    }

    function pauseMusic() {
      bgm.pause();
      musicOn = false;
      musicBtn.textContent = '🎵';
      musicBtn.style.borderColor = 'rgba(255,107,157,0.6)';
    }

    musicBtn.addEventListener('click', () => {
      musicOn ? pauseMusic() : playMusic();
    });

    // 首次点击页面自动播放
    document.addEventListener('click', function autoPlay() {
      if (!musicOn) playMusic();
    }, { once: true });

    // ========== 画布与粒子系统 ==========
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H;
    let particles = [];
    let ripples = [];
    let sparkles = [];
    let floatingTexts = [];
    let time = 0;

    function resize() {
      W = canvas.width = innerWidth;
      H = canvas.height = innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // 爱心公式
    function hx(t) { return 16 * Math.pow(Math.sin(t), 3); }
    function hy(t) { return -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)); }

    // 颜色库
    const palette = [
      '#ff2d78', '#ff4473', '#ff6b9d', '#ff80ab', '#ffb3c6',
      '#ff4081', '#f50057', '#ff1744', '#ff5252', '#ffffff',
      '#ffd1e0', '#ff99bb', '#ff6688'
    ];

    // ========== 粒子 ==========
    class LoveParticle {
      constructor() {
        const t = Math.random() * Math.PI * 2;
        this.ox = hx(t) + (Math.random() - 0.5) * 3;
        this.oy = hy(t) + (Math.random() - 0.5) * 3;
        this.oz = (Math.random() - 0.5) * 8;
        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.baseSize = 1.5 + Math.random() * 6;
        this.twinklePhase = Math.random() * Math.PI * 2;
        this.twinkleSpeed = 0.02 + Math.random() * 0.06;
      }

      project(angleX, angleY) {
        const cosAX = Math.cos(angleX), sinAX = Math.sin(angleX);
        const cosAY = Math.cos(angleY), sinAY = Math.sin(angleY);
        let x1 = this.ox * cosAX - this.oz * sinAX;
        let z1 = this.ox * sinAX + this.oz * cosAX;
        let y1 = this.oy * cosAY - z1 * sinAY;
        let z2 = this.oy * sinAY + z1 * cosAY;
        return { x: x1, y: y1, z: z2 };
      }

      draw(ctx, scale, cx, cy, angleX, angleY, t) {
        const p = this.project(angleX, angleY);
        const depth = (p.z + 8) / 16;
        const twinkle = 0.5 + 0.5 * Math.sin(t * this.twinkleSpeed + this.twinklePhase);
        const alpha = (0.35 + depth * 0.65) * (0.7 + twinkle * 0.3);
        const size = this.baseSize * depth * (0.8 + twinkle * 0.2);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = size * 5;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(p.x * scale + cx, p.y * scale + cy, size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // 初始化粒子
    const PARTICLE_COUNT = 600;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new LoveParticle());
    }

    // ========== 涟漪 ==========
    class Ripple {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 0;
        this.maxRadius = 40 + Math.random() * 60;
        this.speed = 1.2 + Math.random() * 2.5;
        this.life = 1;
        this.color = palette[Math.floor(Math.random() * palette.length)];
      }
      update() {
        this.radius += this.speed;
        this.life -= 0.015;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.life * 0.55;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2 * this.life;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // ========== 闪光粒子 ==========
    class Sparkle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 1;
        this.life = 1;
        this.decay = 0.012 + Math.random() * 0.03;
        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.size = 1.5 + Math.random() * 4;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.04;
        this.life -= this.decay;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.shadowBlur = this.size * 5;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ========== 飘浮文字 ==========
    class FloatingText {
      constructor(x, y, text) {
        this.x = x;
        this.y = y;
        this.text = text || '💖';
        this.life = 1;
        this.decay = 0.008;
        this.vy = -1.5 - Math.random() * 2;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.size = 18 + Math.random() * 22;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.font = `${this.size}px Arial`;
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    // ========== 触摸/点击事件 ==========
    function emitEffects(cx, cy) {
      ripples.push(new Ripple(cx, cy));
      for (let i = 0; i < 20; i++) {
        sparkles.push(new Sparkle(cx, cy));
      }
      const msgs = ['💖', '💕', '💗', '✨', '💫', '🌟', '晴晴', '爱你', '❤️'];
      for (let i = 0; i < 3; i++) {
        const tx = cx + (Math.random() - 0.5) * 60;
        const ty = cy + (Math.random() - 0.5) * 40;
        floatingTexts.push(new FloatingText(tx, ty, msgs[Math.floor(Math.random() * msgs.length)]));
      }
    }

    canvas.addEventListener('click', (e) => emitEffects(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        emitEffects(e.touches[i].clientX, e.touches[i].clientY);
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        emitEffects(e.touches[i].clientX, e.touches[i].clientY);
      }
    }, { passive: false });

    // ========== 主循环 ==========
    function animate() {
      time++;
      ctx.clearRect(0, 0, W, H);

      // 深邃星空背景
      const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H));
      bg.addColorStop(0, '#0d001a');
      bg.addColorStop(0.5, '#050010');
      bg.addColorStop(1, '#010008');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // 背景小星星
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      for (let i = 0; i < 80; i++) {
        const sx = ((i * 137 + 50) % W);
        const sy = ((i * 251 + 80) % H);
        const flicker = 0.3 + 0.7 * Math.abs(Math.sin(time * 0.03 + i));
        ctx.globalAlpha = flicker * 0.6;
        ctx.beginPath();
        ctx.arc(sx, sy, 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 3D 爱心旋转
      const angleY = time * 0.008;
      const angleX = 0.4 + Math.sin(time * 0.015) * 0.2;
      const scale = Math.min(W, H) / 35;
      const cx = W / 2;
      const cy = H / 2;

      // 先画光晕
      ctx.save();
      ctx.globalAlpha = 0.15;
      const glowGrad = ctx.createRadialGradient(cx, cy, scale * 2, cx, cy, scale * 10);
      glowGrad.addColorStop(0, '#ff2d78');
      glowGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      // 画粒子爱心
      for (const p of particles) {
        p.draw(ctx, scale, cx, cy, angleX, angleY, time);
      }

      // 画涟漪
      for (let i = ripples.length - 1; i >= 0; i--) {
        ripples[i].update();
        ripples[i].draw(ctx);
        if (ripples[i].life <= 0) ripples.splice(i, 1);
      }

      // 画闪光
      for (let i = sparkles.length - 1; i >= 0; i--) {
        sparkles[i].update();
        sparkles[i].draw(ctx);
        if (sparkles[i].life <= 0) sparkles.splice(i, 1);
      }

      // 画飘浮文字
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        floatingTexts[i].update();
        floatingTexts[i].draw(ctx);
        if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }

    animate();
    console.log('💖 晴晴我爱你 💖');
  </script>
</body>
</html>
